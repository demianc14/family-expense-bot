# --- atribución: quién asume el costo, no quién se beneficia ---------------

- id: beneficiaria_no_es_quien_paga
  remitente: papa
  texto: "300 de la pensión de mi hija"
  respuesta_llm:
    {
      monto: "300",
      categoria: educacion,
      quien_paga: null,
      confianza_quien_paga: baja,
      descripcion: pensión,
    }
  espera:
    monto: "300"
    categoria: educacion
    fecha: "2026-03-15"
    atribuido_a: papa # provisional; ¿salió del fondo común? no lo dice
    confianza: { monto: alta, categoria: alta, fecha: media, atribuido_a: baja }

