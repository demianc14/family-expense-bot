# Mensajes de ejemplo (sintéticos, no son gastos reales de nadie) junto con la
# respuesta que simulamos del LLM. Sirven para testear la capa de verificación
# sin llamar a ningún LLM: el `respuesta_llm` es la afirmación cruda, y `espera`
# es lo que el sistema debe sostener después de verificarla.
#
# `hoy` es 2026-03-15 en todos los casos. `remitente` es el rol de quien escribe.
# Cada `respuesta_llm` se completa con los campos que no declara (ver
# BASE_LLM en test_parser.py), para que cada caso muestre solo lo que importa.

# --- monto, categoría y fecha ----------------------------------------------

- id: monto_y_categoria_claros
  remitente: mama
  texto: "200 dólares supermercado"
  respuesta_llm:
    { monto: "200", categoria: alimentacion, descripcion: "supermercado" }
  espera:
    monto: "200"
    categoria: alimentacion
    fecha: "2026-03-15"
    atribuido_a: mama
    confianza: { monto: alta, categoria: alta, fecha: media, atribuido_a: media }

- id: fecha_relativa_resuelta
  remitente: demian
  texto: "pagué 15 dólares de taxi ayer"
  respuesta_llm:
    {
      monto: "15",
      categoria: transporte,
      fecha: "2026-03-14",
      confianza_fecha: alta,
      descripcion: taxi,
    }
  espera:
    monto: "15"
    categoria: transporte
    fecha: "2026-03-14"
    atribuido_a: demian
    confianza: { monto: alta, categoria: alta, fecha: alta, atribuido_a: media }

- id: decimales_con_coma
  remitente: papa
  texto: "12,50 en pan"
  respuesta_llm:
    { monto: "12,50", categoria: alimentacion, confianza_categoria: media, descripcion: pan }
  espera:
    monto: "12.50"
    categoria: alimentacion
    fecha: "2026-03-15"
    atribuido_a: papa
    confianza: { monto: alta, categoria: media, fecha: media, atribuido_a: media }

- id: monto_inventado_por_el_llm
  remitente: mama
  texto: "compré cosas en el super"
  respuesta_llm: { monto: "50", categoria: alimentacion, descripcion: compras }
  espera:
    monto: "50"
    categoria: alimentacion
    fecha: "2026-03-15"
    atribuido_a: mama
    # el 50 no está en el mensaje: no se acepta
    confianza: { monto: baja, categoria: alta, fecha: media, atribuido_a: media }

- id: sin_monto
  remitente: papa
  texto: "fui al veterinario"
  respuesta_llm:
    { monto: null, confianza_monto: baja, categoria: mascotas, descripcion: veterinario }
  espera:
    monto: null
    categoria: mascotas
    fecha: "2026-03-15"
    atribuido_a: papa
    confianza: { monto: baja, categoria: alta, fecha: media, atribuido_a: media }

- id: categoria_fuera_de_taxonomia
  remitente: hermana
  texto: "35 en un regalo de cumpleaños"
  respuesta_llm: { monto: "35", categoria: regalos, descripcion: "regalo de cumpleaños" }
  espera:
    monto: "35"
    categoria: otros # "regalos" no existe; la categoría correcta sería "extras"
    fecha: "2026-03-15"
    atribuido_a: hermana
    confianza: { monto: alta, categoria: baja, fecha: media, atribuido_a: media }

- id: categoria_candidata_no_se_acepta
  remitente: papa
  texto: "45 de luz"
  respuesta_llm: { monto: "45", categoria: servicios, descripcion: "planilla de luz" }
  espera:
    monto: "45"
    # servicios está en el yaml como candidata: hasta confirmarla, no recibe datos
    categoria: otros
    fecha: "2026-03-15"
    atribuido_a: papa
    confianza: { monto: alta, categoria: baja, fecha: media, atribuido_a: media }

