    atribuido_a: hermana
    confianza: { monto: alta, categoria: alta, fecha: media, atribuido_a: alta }

- id: mi_hermana_desde_mama_es_una_tia
  # El ejemplo original del diseño: desde mamá, "mi hermana" no es la hija.
  # El LLM solo cita la frase; la tabla de parentescos dice que no es nadie.
  remitente: mama
  texto: "mi hermana se compró ropa, 45"
  respuesta_llm:
    {
      monto: "45",
      categoria: ropa,
      quien_paga: "mi hermana",
      confianza_quien_paga: baja,
      descripcion: ropa,
    }
  espera:
    monto: "45"
    categoria: ropa
    fecha: "2026-03-15"
    atribuido_a: mama # provisional, y con duda: nadie de la lista
    confianza: { monto: alta, categoria: alta, fecha: media, atribuido_a: baja }

