name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tests/test_privacy.py revisa todo el historial, no solo el último commit
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4 # sin node se saltan los tests de paridad con n8n
        with:
          node-version: 22
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      # Sin secrets: Gemini y Telegram van mockeados en los tests.
      - run: pytest
