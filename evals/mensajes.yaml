# Banco de evaluación: mensajes sintéticos (no son gastos reales de nadie)
# etiquetados a mano con lo que el sistema DEBERÍA sostener.
#
# A diferencia de tests/fixtures/mensajes.yaml, acá no hay respuesta simulada
# del LLM: estos mensajes se pasan por el `extraer()` real contra Gemini, con
# `family-expense-bot --evaluar`. Nunca corren en pytest.
#
# `hoy` es 2026-03-15 (domingo) en todos los casos.
#
# `oro`: valor correcto por campo. Un campo ausente no se puntúa (por ejemplo,
#   el monto de un mensaje con dos gastos); `null` quiere decir que lo correcto
#   es no tener valor (un mensaje sin monto).
# `debe_dudar`: campos que tienen que salir con confianza distinta de alta,
#   porque lo correcto es preguntarle a la persona.
#
# Recordatorio de diseño: `atribuido_a` por defecto nunca sale con confianza
# alta, y una fecha que el mensaje no menciona queda como hoy con confianza
# media. Esas dudas son a propósito y no se anotan en `debe_dudar`.

